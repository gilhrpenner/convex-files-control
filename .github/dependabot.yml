version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /example
    schedule:
      interval: weekly
    groups:
      convex:
        patterns:
          - convex
          - convex-test
          - convex-helpers
          - "@convex-dev/*"
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
